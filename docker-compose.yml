services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # 18+ images keep data in a versioned subdirectory and refuse to start with a mount at .../data.
      - db-data:/var/lib/postgresql

volumes:
  db-data:
