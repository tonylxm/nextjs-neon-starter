# Copy to .github/workflows/ci.yml. Next.js + pnpm by default; swap the job for the .NET or uv variant below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads "packageManager" from package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-0000
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The sign-in journey needs a real, migrated Postgres (matches docker-compose.yml).
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Production deploy, only after green CI on main. Turn off Workers Builds' production deploy on push.
  # Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Neon direct URL, for migrations only).
  # Variable: PRODUCTION_URL, the health route (e.g. https://example.com/api/health).
  # To release on a chosen date instead: replace the `if:` with `if: github.event_name == 'workflow_dispatch'` and add `workflow_dispatch:` under `on:`.
  deploy:
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations must work with the code already running (expand and contract).
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Build-time placeholders as in the ci job; the Worker reads its real secrets and Hyperdrive at runtime.
      - run: pnpm run deploy
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-0000
          BETTER_AUTH_URL: http://localhost:3000
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${{ vars.PRODUCTION_URL }}"

  # Kept for private repos created from this template: GitHub secret scanning is a paid add-on on
  # personal accounts, so scan with gitleaks. Public repos with secret scanning on can delete this job.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3 # orgs also need env GITLEAKS_LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

